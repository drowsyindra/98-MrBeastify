<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-size: 16px;
            font-family: Arial, sans-serif;
            width: 300px;
            background-color: #08B0D5;
        }

        .kofi-icon {
            position: absolute;
            right: 10px;
            cursor: pointer;
        }

        .fancy-checkbox {
            position: relative;
            padding-left: 30px;
            cursor: pointer;
        }

        .hidden-checkbox {
            position: absolute;
            opacity: 0;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 20px;
            width: 20px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .checkbox-text {
            vertical-align: bottom;
        }

        .cc98-options {
            display: none;
            margin: 10px 0 0 30px;
        }

        .cc98-options.visible {
            display: block;
        }

        .position-buttons {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .position-option input {
            display: none;
        }

        .position-option span {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 6px;
            background-color: #ffffff;
            border: 1px solid #0b6d84;
            color: #0b6d84;
            cursor: pointer;
            user-select: none;
        }

        .position-option input:checked+span {
            background-color: #0b6d84;
            color: #ffffff;
        }

        .option-group-title {
            margin-bottom: 6px;
        }

        /* Checked state */
        .hidden-checkbox:checked+.checkmark:after {
            content: "";
            position: absolute;
            display: block;
            left: 6px;
            top: 2px;
            width: 6px;
            height: 12px;
            border: solid #333;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
    </style>
</head>

<body>
    <div class="popup-container">
        <h1 id="extension-title">TITLE Options</h1>

        <!-- Fancy Checkbox with Custom Styles -->
        <label class="fancy-checkbox">
            <input type="checkbox" id="disableExtension" class="hidden-checkbox">
            <span class="checkmark"></span>
            <span class="checkbox-text">Extension Enabled</span>
        </label>

        <br><br>

        <label class="fancy-checkbox">
            <input type="checkbox" id="enableCc98" class="hidden-checkbox">
            <span class="checkmark"></span>
            <span class="checkbox-text">cc98</span>
        </label>

        <div id="cc98PositionOptions" class="cc98-options">
            <div>Position</div>
            <div class="position-buttons">
                <label class="position-option">
                    <input type="radio" name="cc98Position" value="left" id="cc98PositionLeft">
                    <span>左侧</span>
                </label>
                <label class="position-option">
                    <input type="radio" name="cc98Position" value="center" id="cc98PositionCenter">
                    <span>中央</span>
                </label>
                <label class="position-option">
                    <input type="radio" name="cc98Position" value="right" id="cc98PositionRight">
                    <span>右侧</span>
                </label>
            </div>
        </div>

        <br><br>

        <div>
            <div class="option-group-title">Image Source</div>
            <div class="position-buttons">
                <label class="position-option">
                    <input type="checkbox" name="imageSources" value="mrbeast" id="imageSourceMrbeast">
                    <span>mrbeast</span>
                </label>
                <label class="position-option">
                    <input type="checkbox" name="imageSources" value="nailong" id="imageSourceNailong">
                    <span>奶龙</span>
                </label>
                <label class="position-option">
                    <input type="checkbox" name="imageSources" value="lieqi" id="imageSourceLieqi">
                    <span>猎奇</span>
                </label>
            </div>
        </div>

        <br><br>

        <!-- Appear Chance Input -->
        <label>
            Appear Chance (%):
            <input type="number" id="appearChance" min="0" max="100" step="5" />
        </label>

        <br><br>

        <!-- Flip Chance Input -->
        <label>
            Flip Chance (%):
            <input type="number" id="flipChance" min="0" max="100" step="5" />
        </label>

        <a href="https://ko-fi.com/magicjinn" target="_blank" class="kofi-icon">
            <img src="https://ko-fi.com/favicon.ico" width="24" height="24">
        </a>
    </div>

    <script src="settings.js"></script>
</body>

</html>
